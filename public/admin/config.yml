backend:
  name: git-gateway
  branch: main

# Guarda los cambios en una rama y los publica al aprobar, en vez de
# escribir directo sobre el sitio en vivo.
publish_mode: editorial_workflow

locale: es

media_folder: "src/assets/fotos"
public_folder: "/src/assets/fotos"

collections:
  # -------------------------------------------------------------------
  - name: "negocio"
    label: "📞 Datos del negocio"
    files:
      - file: "src/data/negocio.json"
        name: "negocio"
        label: "Contacto, horario y ubicación"
        description: >-
          OJO: estos datos deben coincidir EXACTAMENTE con los de tu Google
          Business Profile y tu Instagram. Si no coinciden, Google te
          posiciona peor en el mapa.
        fields:
          - { label: "Nombre del negocio", name: "nombre", widget: "string" }
          - {
              label: "Teléfono (como se muestra)",
              name: "telefono",
              widget: "string",
              hint: "Ej: +56 9 5330 3129",
            }
          - {
              label: "Teléfono para llamar",
              name: "telefonoE164",
              widget: "string",
              hint: "Sin espacios ni guiones. Ej: +56953303129",
            }
          - {
              label: "Número de WhatsApp",
              name: "whatsapp",
              widget: "string",
              hint: "Sin el + ni espacios. Ej: 56953303129",
            }
          - { label: "Correo electrónico", name: "email", widget: "string" }
          - { label: "Enlace a Instagram", name: "instagram", widget: "string" }
          - {
              label: "Usuario de Instagram",
              name: "instagramUsuario",
              widget: "string",
              hint: "Ej: @fletesmatcris",
            }
          - {
              label: "Dirección del sitio",
              name: "sitio",
              widget: "hidden",
            }
          - { label: "Ciudad", name: "ciudad", widget: "string" }
          - { label: "Región", name: "region", widget: "string" }
          - { label: "Código de región", name: "regionCodigo", widget: "hidden" }
          - { label: "País", name: "pais", widget: "hidden" }
          - { label: "Código de país", name: "paisCodigo", widget: "hidden" }

          - label: "Ubicación en el mapa"
            name: "geo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Latitud", name: "lat", widget: "number", value_type: "float" }
              - { label: "Longitud", name: "lng", widget: "number", value_type: "float" }

          - label: "Horario de atención"
            name: "horario"
            widget: "object"
            fields:
              - {
                  label: "Horario (texto visible)",
                  name: "texto",
                  widget: "string",
                  hint: "Ej: Lunes a domingo, 8:00 a 21:00",
                }
              - { label: "Nota adicional", name: "detalle", widget: "string" }
              - {
                  label: "Hora de apertura",
                  name: "abre",
                  widget: "string",
                  hint: "Formato 24h. Ej: 08:00",
                }
              - {
                  label: "Hora de cierre",
                  name: "cierra",
                  widget: "string",
                  hint: "Formato 24h. Ej: 21:00",
                }

          - label: "Datos pendientes"
            name: "pendientes"
            widget: "object"
            collapsed: true
            fields:
              - {
                  label: "Dirección comercial",
                  name: "direccion",
                  widget: "string",
                  required: false,
                  hint: "Necesaria para Google Business Profile. Dejar vacía si no hay local con atención de público.",
                }
              - {
                  label: "RUT",
                  name: "rut",
                  widget: "string",
                  required: false,
                }

  # -------------------------------------------------------------------
  - name: "servicios"
    label: "🚚 Servicios"
    files:
      - file: "src/data/servicios.json"
        name: "servicios"
        label: "Lista de servicios"
        description: >-
          Cada servicio genera su propia página. NO cambies el campo
          "Slug" de un servicio ya publicado: es la URL, y cambiarla
          rompe los enlaces y lo que Google ya tiene indexado.
        fields:
          - label: "Servicios"
            name: "servicios"
            widget: "list"
            collapsed: true
            summary: "{{fields.titulo}}"
            fields:
              - {
                  label: "Slug (URL) — no cambiar si ya está publicado",
                  name: "slug",
                  widget: "string",
                  pattern: ["^[a-z0-9-]+$", "Solo minúsculas, números y guiones"],
                }
              - { label: "Título completo", name: "titulo", widget: "string" }
              - {
                  label: "Título corto",
                  name: "tituloCorto",
                  widget: "string",
                  hint: "El que se ve en las tarjetas y el menú.",
                }
              - label: "Ícono"
                name: "icono"
                widget: "select"
                options: ["camion", "casa", "caja", "escudo", "reloj", "mapa"]
              - {
                  label: "Foto",
                  name: "foto",
                  widget: "string",
                  hint: "Nombre del archivo dentro de src/assets/fotos. Ej: mudanza-casa-santiago.jpg",
                }
              - {
                  label: "Texto alternativo de la foto",
                  name: "fotoAlt",
                  widget: "string",
                  hint: "Describí qué se ve. Lo lee Google y los lectores de pantalla.",
                }
              - {
                  label: "Resumen (tarjetas)",
                  name: "resumen",
                  widget: "text",
                  hint: "Una o dos líneas.",
                }
              - {
                  label: "Título para Google",
                  name: "metaTitulo",
                  widget: "string",
                  hint: "Máximo ~55 caracteres para que no se corte en el buscador.",
                }
              - {
                  label: "Descripción para Google",
                  name: "metaDescripcion",
                  widget: "text",
                  hint: "Entre 120 y 155 caracteres. Es el texto que aparece bajo el título en Google.",
                }
              - {
                  label: "Introducción de la página",
                  name: "intro",
                  widget: "text",
                }
              - {
                  label: "Qué incluye",
                  name: "incluye",
                  widget: "list",
                  field: { label: "Punto", name: "punto", widget: "string" },
                }
              - {
                  label: "Ideal para",
                  name: "ideal",
                  widget: "list",
                  field: { label: "Punto", name: "punto", widget: "string" },
                }

  # -------------------------------------------------------------------
  - name: "faq"
    label: "❓ Preguntas frecuentes"
    files:
      - file: "src/data/faq.json"
        name: "faq"
        label: "Preguntas y respuestas"
        description: >-
          Estas preguntas también se envían a Google como datos
          estructurados y pueden aparecer desplegables en el resultado de
          búsqueda. Las respuestas tienen que ser verdaderas: si prometen
          algo que no se cumple, Google puede quitar el formato especial.
        fields:
          - label: "Preguntas"
            name: "faq"
            widget: "list"
            collapsed: true
            summary: "{{fields.pregunta}}"
            fields:
              - { label: "Pregunta", name: "pregunta", widget: "string" }
              - { label: "Respuesta", name: "respuesta", widget: "text" }
